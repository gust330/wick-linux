[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wick-linux"
version = "0.1.0"
description = "Close the lid. Keep working. Linux laptop lid-close sleep inhibitor for coding agents and long builds."
readme = "README.md"
authors = [
    { name = "gust330", email = "gust330@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Utilities"
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
wick = "wick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
