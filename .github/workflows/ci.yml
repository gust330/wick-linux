name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: scripts/e2e.sh
      - run: scripts/build-app.sh

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover tests
        working-directory: linux
      - run: tests/e2e.sh
        working-directory: linux

  linux-logind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: linux/tests/logind/run.sh fedora:42 ubuntu:24.04
