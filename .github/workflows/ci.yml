name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: scripts/e2e.sh
      - run: scripts/build-app.sh

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    container: python:${{ matrix.python }}-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq procps perl
      - uses: actions/checkout@v5
      - run: python -m unittest discover tests
        working-directory: linux
      - run: tests/e2e.sh
        working-directory: linux

# linux/tests/logind and linux/tests/gnome aren't here on purpose. They need a privileged container with systemd as
# PID 1, which took down a hosted runner. Run them locally before a release.
